name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Coverage runs on every PR (not just main) so threshold regressions
      # surface before merge. The artifact upload stays main-only — we don't
      # need to retain coverage reports for transient PR builds.
      - name: Coverage
        run: bun run test:coverage

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify skills shipped
        run: |
          # skills/_shared/ holds cross-cutting assets (no SKILL.md by design);
          # skip it. Every other skills/<name>/ MUST ship a SKILL.md.
          # Manifest points at source skills/ (not dist/) so GitHub/OMP installs work.
          for d in skills/*/; do
            name=$(basename "$d")
            if [ "$name" = "_shared" ]; then continue; fi
            test -f "skills/$name/SKILL.md" || { echo "Missing skills/$name/SKILL.md"; exit 1; }
          done
          test -d "skills/_shared/aesthetics" || { echo "Missing skills/_shared/aesthetics/"; exit 1; }
          test -f "src/index.ts" || { echo "Missing src/index.ts (omp/pi extension entry)"; exit 1; }
          test -f "dist/index.js" || { echo "Missing dist/index.js after build (npm main/bin)"; exit 1; }
